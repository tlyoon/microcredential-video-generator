parser:
  heading_style_patterns:
    - '^Heading\s*(\d+)$'
  use_outline_level: true
  infer_numbered_headings: false
  section_number_regex: '^(\d+(?:\.\d+)*)\.?\s+'

course:
  id: replace_me
  title: Replace Me
  audience: Replace with intended learner group
  source_role: The explicitly supplied DOCX is the authoritative content source.
  design_principle: Video teaches the reasoning; the source document carries the detail.
  narration_wpm: 130
  max_slides: 7
  target_video_minutes: 6
  llm:
    provider: gemini
    model: gemini-flash-latest
    thinking_level: high
    api_key_env: GEMINI_API_KEY
    review_pass: true
    max_source_characters_per_lesson: 220000
    prompt_set: microcredential_v2
  content_selection:
    priority_terms: []
    source_words_per_slide: 110
    max_context_blocks: 6

videos:
  - id: V01
    title: Replace with lesson title
    focus: Replace with concise lesson focus
    target_minutes: 6
    core_selectors:
      - heading_contains: 'Replace with source heading text'
    reference_selectors: []
    learning_outcomes:
      - Replace with a source-grounded learning outcome.
    check_question: Replace with a conceptual check.
