[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microcredential-video-generator"
version = "0.7.0"
description = "Global-first DOCX-to-microcredential video pipeline with Gemini course design, dedicated narration polishing, configurable TTS, and MP4 assembly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.2",
  "google-genai",
  "google-cloud-texttospeech>=2.27",
  "latex2mathml>=3.81.0",
  "mathml2omml>=0.0.2",
  "omml2latex>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
windows = ["pywin32>=306"]

[project.scripts]
microvid = "microvid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
microvid = ["profiles/*.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
